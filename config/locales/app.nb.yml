    faqH: Spørsmål
    faq:
    - q: Hvem bestemmer prisen?
      a: Busselskapene. Hver operatør legger inn timepris, km-pris, minimumstid og tillegg for sine busser. Bussly beregner rute, pauser, bom og ferje, og bruker operatørens priser på turen din.
    - q: Hva er prisgarantien?
      a: Hvis ingen operatør i området har lagt inn priser som dekker turen, gir vi deg en garantert pris basert på markedspriser. Vi finner bussen innen 24 timer, ellers får du depositumet tilbake.
    - q: Hvorfor er mva 12 %?
      a: Persontransport har redusert mva-sats på 12 % i Norge. Prisene vi viser inkluderer mva.
    - q: Hva er kjøre- og hviletid?
      a: 'Sjåfører følger EUs regler: maks 4,5 timer før en pause på 45 minutter, og normalt maks 9 timer kjøring per dag. Lange turer får derfor pauser eller en ekstra sjåfør, og det er med i prisen.'
    - q: Kan vi avbestille?
      a: Gratis fram til 14 dager før avreise. Deretter beholdes depositumet på 20 %.
