    faqH: Questions
    faq:
    - q: Who sets the price?
      a: The coach companies. Each operator enters an hourly rate, per-km rate, minimum hours and surcharges for their buses. Bussly works out route, breaks, tolls and ferries, and applies the operator’s prices to your trip.
    - q: What is the price guarantee?
      a: If no operator in the area has prices that cover your trip, we give you a guaranteed price based on market rates. We find the bus within 24 hours, or you get your deposit back.
    - q: Why is VAT 12%?
      a: Passenger transport has a reduced 12% VAT rate in Norway. The prices we show include VAT.
    - q: What are driving and rest rules?
      a: 'Drivers follow EU rules: at most 4.5 hours before a 45-minute break, and normally at most 9 hours of driving per day. Long trips get breaks or a second driver, and that is in the price.'
    - q: Can we cancel?
      a: Free until 14 days before departure. After that the 20% deposit is kept.
